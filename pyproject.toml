[project]
name = "nanowhale"
version = "0.1.0"
description = "A ~110M-parameter DeepSeek-V4 trained from scratch (CPU/CUDA + AWS Neuron)"
requires-python = ">=3.10,<3.13"
# Runtime deps live in requirements.txt and are pinned against the trn2 host
# venv at /opt/torch-neuronx/.venv. We do not declare them here on purpose —
# torch-neuronx ships only via the AWS Neuron index, and pyproject
# `dependencies` is harder to keep in sync with that constraint.
dependencies = []
