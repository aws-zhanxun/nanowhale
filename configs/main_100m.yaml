# Main config: ~110M parameters
# Target: practical small DeepSeek-V4 chat model
#
# Architecture summary:
#   hidden_size: 320
#   num_hidden_layers: 8
#   num_attention_heads: 8 (with 1 KV head - MQA style)
#   head_dim: 96 (32 rope + 64 nope)
#   q_lora_rank: 160
#   o_groups: 2, o_lora_rank: 80
#   MoE: 4 routed experts + 1 shared, top-2 routing
#   moe_intermediate_size: 640 (SwiGLU FFN per expert)
#   Hyper-Connections: hc_mult=4
#   Vocab: 129280 (DeepSeek-V4 tokenizer)
#   Context: 2048
#
# Total parameters: ~110M
# Embeddings: ~41M (vocab * hidden)
# Non-embedding: ~69M

model:
  vocab_size: 129280
  hidden_size: 320
  num_hidden_layers: 4  # original: 8
  num_attention_heads: 4  # original: 8
  num_key_value_heads: 1
  moe_intermediate_size: 640
  n_routed_experts: 4
  n_shared_experts: 1
  num_experts_per_tok: 2
  q_lora_rank: 160
  head_dim: 96
  qk_rope_head_dim: 32
  o_groups: 2
  o_lora_rank: 80
  hc_mult: 4
  hc_sinkhorn_iters: 2
  hc_eps: 1.0e-6
  num_hash_layers: 0
  swiglu_limit: 0.0
  scoring_func: sqrtsoftplus
  routed_scaling_factor: 1.5
  topk_method: noaux_tc
  norm_topk_prob: true
  max_position_embeddings: 2048
  rms_norm_eps: 1.0e-6
  rope_theta: 10000.0
  initializer_range: 0.02
  tie_word_embeddings: false
  attention_bias: false
  attention_dropout: 0.0
  compress_ratios: [0, 0, 0, 0, 0]  # original: [0, 0, 0, 0, 0, 0, 0, 0, 0]  (length = num_hidden_layers + 1)

training:
  max_seq_length: 512  # original: 2048
  per_device_train_batch_size: 1  # original: 8
  gradient_accumulation_steps: 1  # original: 4
  learning_rate: 6.0e-4
  weight_decay: 0.1
  adam_beta1: 0.9
  adam_beta2: 0.95
  max_grad_norm: 1.0
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  bf16: true
  max_steps: 10  # original: 5000
  save_steps: 500
  logging_steps: 10
  gradient_checkpointing: true
